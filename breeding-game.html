<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plant Breeding Mini-Game</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 40px; 
            background: #f9f9f9;
            line-height: 1.6;
        }

        h1 { color: #2b5a2b; }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
            max-width: 500px;
        }

        button {
            padding: 10px 18px;
            background: #2b5a2b;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }

        button:hover {
            background: #3c7a3c;
        }

        .f2-item {
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>

<body>

<h1>🌱 Plant Breeding Mini-Game</h1>
<p>Try crossing different genotypes and observe how selection produces genetic gain!</p>

<div class="box">
    <h3>Choose Parents</h3>

    <label>Parent 1:</label><br>
    <select id="p1">
        <option value="280">Genotype A (KPE = 280)</option>
        <option value="320">Genotype B (KPE = 320)</option>
        <option value="410">Genotype C (KPE = 410)</option>
    </select>

    <br><br>

    <label>Parent 2:</label><br>
    <select id="p2">
        <option value="280">Genotype A (KPE = 280)</option>
        <option value="320">Genotype B (KPE = 320)</option>
        <option value="410">Genotype C (KPE = 410)</option>
    </select>

    <br><br>

    <button onclick="makeF1()">Create F1</button>

    <div id="f1-result" style="margin-top: 10px;"></div>
</div>

<div class="box">
    <h3>F2 Population (n = 20)</h3>
    <button onclick="makeF2()">Generate F2</button>
    <div id="f2-list"></div>
</div>

<div class="box">
    <h3>Selection</h3>
    <button onclick="selectBest()">Select Best 3 → Next Generation</button>
    <div id="selection-result" style="margin-top: 10px;"></div>
</div>

<script>
let f1_value = null;
let current_mean = null;

function makeF1() {
    let p1 = Number(document.getElementById("p1").value);
    let p2 = Number(document.getElementById("p2").value);

    f1_value = Math.round((p1 + p2) / 2 + (Math.random() * 20 - 10));

    document.getElementById("f1-result").innerHTML =
        "<b>F1 KPE:</b> " + f1_value;

    current_mean = f1_value;
}

function makeF2() {
    if (f1_value === null) {
        alert("Create F1 first!");
        return;
    }

    let html = "";
    window.f2 = [];

    for (let i = 0; i < 20; i++) {
        let v = Math.round(f1_value + (Math.random() * 80 - 40));
        window.f2.push(v);
        html += `<div class="f2-item">Plant ${i + 1}: ${v}</div>`;
    }

    document.getElementById("f2-list").innerHTML = html;
}

function selectBest() {
    if (!window.f2) {
        alert("Generate F2 first!");
        return;
    }

    let best = [...window.f2].sort((a,b)=>b-a).slice(0,3);
    let new_mean = Math.round(best.reduce((a,b)=>a+b, 0) / 3);

    let gain = new_mean - current_mean;

    document.getElementById("selection-result").innerHTML =
        `<b>Selected:</b> ${best.join(", ")}<br>
         <b>New Mean:</b> ${new_mean}<br>
         <b>Genetic Gain:</b> ${gain}`;

    current_mean = new_mean;
    f1_value = new_mean;
}
</script>

</body>
</html>

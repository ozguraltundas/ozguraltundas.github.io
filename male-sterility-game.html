<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Male Sterility Discovery Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .game-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .stage {
            max-width: 800px;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            animation: fadein 0.5s ease;
            text-align: center;
        }

        @keyframes fadein {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .button {
            padding: 12px 22px;
            background: #2a7f62;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
        }

        .button:hover {
            background: #349f7a;
        }
    </style>
</head>

<body>

<div class="game-container">
    <div id="stageArea" class="stage">
        <!-- Content loads here -->
    </div>
</div>

<script>
let stage = 0;

function loadStage() {
    const area = document.getElementById("stageArea");

    // ---------------- Stage 0 ----------------
    if (stage === 0) {
        area.innerHTML = `
            <h1>🌾 Male Sterility Discovery Game</h1>
            <h2>You are a geneticist at the Danforth Plant Science Center</h2>
            <p>Your mission is to discover the gene responsible for male sterility in sorghum.</p>
            <div class="button" onclick="nextStage()">Begin Mission</div>
        `;
    }

    // ---------------- Stage 1 ----------------
    if (stage === 1) {
        area.innerHTML = `
            <h1>🌱 What is Male Sterility?</h1>
            <p>Some plants produce viable pollen (male-fertile), while others fail to make pollen (male-sterile).</p>

            <div style="display:flex; gap:40px; justify-content:center; margin-top:30px;">
                <div onclick="alert('Male-fertile plants produce viable pollen. They can self or cross. Used as male parents.')"
                     style="cursor:pointer; background:#e0ffe0; padding:20px; border-radius:12px; width:240px;">
                    <h3>🟩 Male-Fertile Plant</h3>
                    <p>Produces pollen</p>
                </div>

                <div onclick="alert('Male-sterile plants do NOT produce pollen. They cannot self-fertilize. Used as FEMALE parents in hybrid production.')"
                     style="cursor:pointer; background:#ffe0e0; padding:20px; border-radius:12px; width:240px;">
                    <h3>🟥 Male-Sterile Plant</h3>
                    <p>No pollen</p>
                </div>
            </div>

            <p style="margin-top:30px; font-size:17px;">
                Male sterility ensures that all seeds must come from another parent — meaning they are <b>hybrids</b>.
            </p>

            <div class="button" onclick="nextStage()">Continue</div>
        `;
    }

    // ---------------- Stage 2 ----------------
    if (stage === 2) {
        area.innerHTML = `
            <h1>🌾 Recognizing the Sterile Phenotype</h1>
            <p>Male-sterile sorghum plants produce <b>white anthers</b> instead of yellow ones.</p>

            <p><i>Which anther is from a male-sterile plant?</i></p>

            <div style="display:flex; gap:40px; justify-content:center; margin-top:30px;">
                <div onclick="wrongChoice()" style="cursor:pointer; background:#fff9d6; padding:20px; border-radius:12px; width:200px;">
                    <h3>🌼 Yellow Anthers</h3>
                    <p>Fertile</p>
                </div>

                <div onclick="correctChoice()" style="cursor:pointer; background:#f3f3f3; padding:20px; border-radius:12px; width:200px;">
                    <h3>⚪ White Anthers</h3>
                    <p>Sterile</p>
                </div>
            </div>

            <p id="feedback" style="margin-top:30px; font-size:18px;"></p>
        `;

        window.correctChoice = function () {
            document.getElementById("feedback").innerHTML =
                "<span style='color:green;'>Correct! White anthers indicate male sterility.</span><br><br>" +
                "<div class='button' onclick='nextStage()'>Continue</div>";
        };

        window.wrongChoice = function () {
            document.getElementById("feedback").innerHTML =
                "<span style='color:red;'>Not correct — yellow anthers are fertile. Try again!</span>";
        };
    }

    // ---------------- Stage 3 ----------------
    if (stage === 3) {
        area.innerHTML = `
            <h1>🧬 Bulk Segregant Mapping</h1>
            <p>Select the chromosome where the BSA peak appears.</p>

            <div style="display:flex; gap:40px; justify-content:center; flex-wrap:wrap;">
                <div onclick="wrongChr()" class="chrBox">Chr1</div>
                <div onclick="wrongChr()" class="chrBox">Chr2</div>
                <div onclick="wrongChr()" class="chrBox">Chr3</div>
                <div onclick="correctChr()" class="chrBox" style="border:2px solid #4caf50;">Chr4 (Peak)</div>
            </div>

            <p id="mapFeedback" style="margin-top:25px; font-size:18px;"></p>

            <img src="fig1_ems.png" style="width:420px; margin-top:20px; border-radius:10px;">
        `;

        document.querySelectorAll(".chrBox").forEach(el => {
            el.style.cursor = "pointer";
            el.style.background = "#eef";
            el.style.padding = "15px";
            el.style.borderRadius = "10px";
            el.style.width = "120px";
            el.style.textAlign = "center";
            el.style.margin = "5px";
        });

        window.correctChr = function () {
            document.getElementById("mapFeedback").innerHTML =
                "<span style='color:green;'>Correct! The BSA peak is on chromosome 4.</span><br><br>" +
                "<div class='button' onclick='nextStage()'>Continue</div>";
        };

        window.wrongChr = function () {
            document.getElementById("mapFeedback").innerHTML =
                "<span style='color:red;'>Incorrect — try another chromosome.</span>";
        };
    }

    // ---------------- Stage 4 ----------------
    if (stage === 4) {
        area.innerHTML = `
            <h1>🌿 Phylogeny of MS8 (Fig. 2)</h1>

            <p><i>Which clade contains MS8?</i></p>

            <div style="display:flex; gap:20px; justify-content:center; flex-wrap:wrap;">
                <div onclick="wrongClade()" class="cladeBox">MS32 Clade</div>
                <div onclick="wrongClade()" class="cladeBox">Zm bHLH51 Clade</div>
                <div onclick="correctClade()" class="cladeBox" style="border:2px solid #2ca02c;">MS8 / ms8-1 / ms8-2 Clade</div>
            </div>

            <p id="cladeFeedback" style="margin-top:25px; font-size:18px;"></p>

            <img src="fig2_phylogeny.png" style="width:450px; margin-top:20px; border-radius:10px;">
        `;

        document.querySelectorAll(".cladeBox").forEach(el => {
            el.style.cursor = "pointer";
            el.style.background = "#f5f5f5";
            el.style.padding = "18px";
            el.style.borderRadius = "10px";
            el.style.width = "220px";
            el.style.textAlign = "center";
            el.style.margin = "5px";
        });

        window.correctClade = function () {
            document.getElementById("cladeFeedback").innerHTML =
                "<span style='color:green;'>Correct! MS8 clusters in the male-sterility-associated bHLH clade.</span><br><br>" +
                "<div class='button' onclick='nextStage()'>Continue</div>";
        };

        window.wrongClade = function () {
            document.getElementById("cladeFeedback").innerHTML =
                "<span style='color:red;'>Incorrect clade — try again.</span>";
        };
    }

    // ---------------- Stage 5 ----------------
    if (stage === 5) {
        area.innerHTML = `
            <h1>🧬 Genetic Models (Fig. 3)</h1>
            <p>Which model best explains ms8 sectoring?</p>

            <div style="display:flex; gap:20px; justify-content:center; flex-wrap:wrap;">
                <div onclick="wrongModel()" class="modelBox">Model A — Simple Recessive</div>
                <div onclick="wrongModel()" class="modelBox">Model B — Mosaicism</div>
                <div onclick="correctModel()" class="modelBox" style="border:2px solid #2ca02c;">Model C — Linked Dominant + Complementation</div>
            </div>

            <p id="modelFeedback" style="margin-top:25px; font-size:18px;"></p>

            <img src="fig3_genetic_models.png" style="width:480px; margin-top:20px; border-radius:10px;">
        `;

        document.querySelectorAll(".modelBox").forEach(el => {
            el.style.cursor = "pointer";
            el.style.background = "#eee";
            el.style.padding = "20px";
            el.style.borderRadius = "10px";
            el.style.width = "260px";
            el.style.textAlign = "center";
            el.style.margin = "8px";
        });

        window.correctModel = function () {
            document.getElementById("modelFeedback").innerHTML =
                "<span style='color:green;'>Correct! Model C explains rare chimera formation.</span><br><br>" +
                "<div class='button' onclick='nextStage()'>Continue</div>";
        };

        window.wrongModel = function () {
            document.getElementById("modelFeedback").innerHTML =
                "<span style='color:red;'>Incorrect model — try again.</span>";
        };
    }

    // ---------------- Stage 6 ----------------
    if (stage === 6) {
        area.innerHTML = `
            <h1>🧬 Sequencing Mutations (Fig. 5)</h1>
            <p>Select the mutation most consistent with loss of function.</p>

            <div style="display:flex; gap:20px; justify-content:center; flex-wrap:wrap;">
                <div onclick="wrongSeq()" class="seqBox">P98S — Missense</div>
                <div onclick="correctSeq()" class="seqBox" style="border:2px solid #2ca02c;">Q111* — STOP codon</div>
                <div onclick="wrongSeq()" class="seqBox">Q150* — Late STOP</div>
            </div>

            <p id="seqFeedback" style="margin-top:25px; font-size:18px;"></p>

            <img src="fig5_mutations.png" style="width:480px; margin-top:20px; border-radius:10px;">
        `;

        document.querySelectorAll(".seqBox").forEach(el => {
            el.style.cursor = "pointer";
            el.style.background = "#eee";
            el.style.padding = "20px";
            el.style.borderRadius = "10px";
            el.style.width = "240px";
            el.style.textAlign = "center";
            el.style.margin = "8px";
        });

        window.correctSeq = function () {
            document.getElementById("seqFeedback").innerHTML =
                "<span style='color:green;'>Correct! Q111* is a strong loss-of-function mutation.</span><br><br>" +
                "<div class='button' onclick='nextStage()'>Continue</div>";
        };

        window.wrongSeq = function () {
            document.getElementById("seqFeedback").innerHTML =
                "<span style='color:red;'>Incorrect — examine Fig. 5 more closely.</span>";
        };
    }

    // ---------------- Stage 7 ----------------
    if (stage === 7) {
        area.innerHTML = `
            <h1>🧬 CRISPR Validation (Fig. 6)</h1>
            <p>Which CRISPR allele disrupts the bHLH domain?</p>

            <div style="display:flex; gap:20px; justify-content:center; flex-wrap:wrap;">
                <div onclick="wrongCrispr()" class="crisprBox">CRISPR-1 — Synonymous</div>
                <div onclick="correctCrispr()" class="crisprBox" style="border:2px solid #2ca02c;">CRISPR-2 — bHLH disrupted</div>
                <div onclick="wrongCrispr()" class="crisprBox">CRISPR-3 — 3′UTR</div>
            </div>

            <p id="crisprFeedback" style="margin-top:25px; font-size:18px;"></p>

            <img src="fig6_crispr_validation.png" style="width:480px; margin-top:20px; border-radius:10px;">
        `;

        document.querySelectorAll(".crisprBox").forEach(el => {
            el.style.cursor = "pointer";
            el.style.background = "#eee";
            el.style.padding = "20px";
            el.style.borderRadius = "10px";
            el.style.width = "240px";
            el.style.textAlign = "center";
            el.style.margin = "8px";
        });

        window.correctCrispr = function () {
            document.getElementById("crisprFeedback").innerHTML =
                "<span style='color:green;'>Correct! CRISPR-2 reproduces the ms8 phenotype.</span><br><br>" +
                "<div class='button' onclick='nextStage()'>Finish Mission</div>";
        };

        window.wrongCrispr = function () {
            document.getElementById("crisprFeedback").innerHTML =
                "<span style='color:red;'>Incorrect — this edit does not disrupt MS8.</span>";
        };
    }

    // ---------------- Stage 8 ----------------
    if (stage === 8) {
        area.innerHTML = `
            <h1>🏁 Mission Complete!</h1>
            <p>You successfully identified and validated the male sterility gene <b>MS8</b> in sorghum.</p>

            <ul style="text-align:left; max-width:600px; margin:auto; font-size:18px;">
                <li>Identified male-sterile phenotype</li>
                <li>Mapped locus to Chr4</li>
                <li>Selected correct phylogenetic clade</li>
                <li>Chose the correct genetic model</li>
                <li>Interpreted sequencing mutations</li>
                <li>Validated MS8 using CRISPR</li>
            </ul>

            <div class="button" onclick="window.location.href='quiz-menu.html'">
                Take the Quiz ➜
            </div>
        `;
    }
}

// ---------------- Next Stage ----------------
function nextStage() {
    stage++;
    loadStage();
}

// Load first stage
loadStage();
</script>

</body>
</html>

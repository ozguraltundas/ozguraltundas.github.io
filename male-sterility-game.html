<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Male Sterility Discovery Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .stage {
            max-width: 800px;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            animation: fadein 0.5s ease;
        }

        @keyframes fadein {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        h1, h2, p {
            margin-bottom: 20px;
        }

        .button {
            padding: 12px 22px;
            background: #2a7f62;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
        }

        .button:hover {
            background: #349f7a;
        }
    </style>
</head>

<body>

<div class="game-container">
    <div id="stageArea" class="stage">
        <!-- STAGES WILL LOAD HERE -->
    </div>
</div>

<script>
// -------------------------------
// BASIC GAME ENGINE (Stage Loader)
// -------------------------------
let stage = 0;

function loadStage() {
    const area = document.getElementById("stageArea");

    if (stage === 0) {
        area.innerHTML = `
            <h1>🌾 Male Sterility Discovery Game</h1>
            <h2>You are a geneticist at the Danforth Plant Science Center</h2>
            <p>Your mission is to discover the gene responsible for male sterility in sorghum.</p>
            <div class="button" onclick="nextStage()">Begin Mission</div>
        `;
    }

    // Future stages will be inserted here one by one.
}

function nextStage() {
    stage++;
    loadStage();
}

// Initialize first stage
loadStage();
</script>

</body>
</html>

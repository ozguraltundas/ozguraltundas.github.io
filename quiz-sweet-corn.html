function setMode(m) {
  mode = m;
  alert("Mode set to: " + m);
}

function renderQuiz() {
  const quizDiv = document.getElementById("quiz");
  quizDiv.innerHTML = "";
  questions.forEach((item, idx) => {
    let html = `<div class="question-box">
      <div class="question">${item.q}</div>`;
    item.options.forEach((opt, i) => {
      html += `<div class="option">
        <label><input type="radio" name="q${idx}" value="${i}" onchange="checkAnswer(${idx}, ${i})">
 ${opt}</label>
      </div>`;
    });
    html += `<div id="feedback-${idx}"></div></div>`;
    quizDiv.innerHTML += html;
  });
}
function checkAnswer(qIndex, selectedIndex) {
  if (mode !== "learning") return;

  const correctIndex = questions[qIndex].answer;
  const feedback = document.getElementById(`feedback-${qIndex}`);

  if (selectedIndex === correctIndex) {
    feedback.innerHTML = "<span class='correct'>✔ Correct</span>";
  } else {
    feedback.innerHTML = "<span class='wrong'>✘ Wrong</span>";
  }
}

  
function submitQuiz() {
  let score = 0;

  questions.forEach((item, idx) => {
    const selected = document.querySelector(`input[name="q${idx}"]:checked`);
    const feedback = document.getElementById(`feedback-${idx}`);

    if (!selected) return;

    if (parseInt(selected.value) === item.answer) {
      score++;
      if (mode === "learning") {
        feedback.innerHTML = "<span class='correct'>✔ Correct</span>";
      }
    } else {
      if (mode === "learning") {
        feedback.innerHTML = "<span class='wrong'>✘ Wrong</span>";
      }
    }
  });

  const total = questions.length;
  const percent = ((score / total) * 100).toFixed(1);

  document.getElementById("resultBox").innerHTML =
    `<strong>Score:</strong> ${score} / ${total} &nbsp; 
     (<strong>${percent}%</strong>)`;
}


renderQuiz();
</script>

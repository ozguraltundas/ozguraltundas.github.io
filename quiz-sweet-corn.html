<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sweet Corn Paper Quiz</title>

<style>
body {

  background: #f7f7f7;

  padding: 40px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.mode-buttons {
  text-align: center;
  margin-bottom: 30px;
}

.mode-buttons button {
  padding: 10px 20px;
  margin: 0 10px;
  font-size: 16px;
  cursor: pointer;
}

.question-box {
  background: white;
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 20px;
}

.question {
  font-weight: bold;
  margin-bottom: 10px;
}

.option {
  margin: 5px 0;
}

.correct {
  color: green;
  font-weight: bold;
}

.wrong {
  color: red;
  font-weight: bold;
}

#submitBtn {
  display: block;
  margin: 40px auto;
  padding: 12px 30px;
  font-size: 18px;
}
</style>
</head>

<body>

<h1>🌽 Sweet Corn Flavor Genetics Quiz</h1>

<div class="mode-buttons">

  <button onclick="setMode('exam')">Exam Mode</button>
</div>

<div id="quiz"></div>

<button id="submitBtn" onclick="submitQuiz()">Submit</button>

<script>
let mode = "learning";

    q: "Which sweet corn genome did the researchers sequence to better understand structural variation?",

  mode = m;

}

function renderQuiz() {
  const quizDiv = document.getElementById("quiz");
  quizDiv.innerHTML = "";

    let html = `
      <div class="question-box">
        <div class="question">${idx + 1}. ${item.q}</div>
    `;

    item.options.forEach((opt, i) => {
      html += `
        <div class="option">
          <label>
            <input type="radio" name="q${idx}" value="${i}">
            ${opt}
          </label>
        </div>
      `;
    });

    html += `<div id="feedback-${idx}"></div></div>`;
    quizDiv.innerHTML += html;
  });
}
